  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

\"margin: 0; font-size: 19px; color: #5E5A52\">Every feast, fast and dated event in the Old Testament, set like a clock: the first month at one o’clock, the twelfth at the top (Exod 12:2). Choose a month.<\u002Fp>\n<\u002Fheader>\n\n<div role=\"group\" aria-label=\"Show on the calendar\" style=\"display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: center; border-top: 1px solid #CFC8B8; border-bottom: 1px solid #CFC8B8; padding: 6px 0\">\n<sc-for list=\"{{toggles}}\" as=\"g\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{g.pick}}\" aria-pressed=\"{{g.on}}\" style=\"min-height: 44px; padding: 0 4px; background: none; border: 0; color: #1C1B19; font-size: 17px; cursor: pointer; display: flex; align-items: center; gap: 10px\">\n<span aria-hidden=\"true\" style=\"width: 16px; height: 16px; border: 1.5px solid #1C1B19; box-sizing: border-box; display: flex; align-items: center; justify-content: center\"><span style=\"width: 8px; height: 8px; background: {{g.check}}\"><\u002Fspan><\u002Fspan>\n<span aria-hidden=\"true\" style=\"width: {{g.size}}; height: {{g.size}}; border-radius: 50%; border: 1.5px solid {{g.ink}}; background: {{g.fill}}; box-sizing: border-box\"><\u002Fspan>\n<span>{{g.label}}<\u002Fspan>\n<span style=\"color: #5E5A52\">{{g.count}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<button type=\"button\" sc-camel-on-click=\"{{allPick}}\" style=\"min-height: 44px; padding: 0 4px; margin-left: auto; background: none; border: 0; color: #A8261B; font-size: 17px; font-style: italic; cursor: pointer; text-decoration: underline; text-underline-offset: 3px\">{{allLabel}}<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px 56px; align-items: flex-start\">\n\n<div style=\"flex: 0 1 600px; min-width: 0; width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"position: relative; width: 100%; aspect-ratio: 1 / 1\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: 1.5%; top: 1.5%; width: 97%; height: 97%; border-radius: 50%; border: 1.5px solid #1C1B19; box-sizing: border-box; background: conic-gradient(from {{wedgeFrom}}deg, {{wedgeColor}} 0deg 30deg, transparent 30deg 360deg)\"><\u002Fdiv>\n<sc-for list=\"{{ticks}}\" as=\"t\" hint-placeholder-count=\"12\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: calc(50% - 0.5px); top: 1.5%; width: 1px; height: 15%; background: #BDB5A3; transform-origin: 50% 323.33%; transform: rotate({{t.deg}}deg)\"><\u002Fdiv>\n<\u002Fsc-for>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 16.5%; top: 16.5%; width: 67%; height: 67%; border-radius: 50%; border: 1px solid #1C1B19; box-sizing: border-box; background: #F5F2EA\"><\u002Fdiv>\n<sc-for list=\"{{ticks}}\" as=\"t\" hint-placeholder-count=\"12\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: calc(50% - 0.5px); top: 16.5%; width: 1px; height: 17.5%; background: #E2DCCD; transform-origin: 50% 191.43%; transform: rotate({{t.deg}}deg)\"><\u002Fdiv>\n<\u002Fsc-for>\n<sc-for list=\"{{dots}}\" as=\"d\" hint-placeholder-count=\"40\">\n<div aria-hidden=\"true\" style=\"position: absolute; left: {{d.left}}; top: {{d.top}}; width: {{d.size}}; height: {{d.size}}; border-radius: 50%; transform: translate(-50%, -50%); background: {{d.fill}}; border: 1.5px solid {{d.ink}}; box-sizing: border-box\"><\u002Fdiv>\n<\u002Fsc-for>\n<div aria-hidden=\"true\" style=\"position: absolute; left: calc(50% - 1px); top: 21%; width: 2px; height: 29%; background: #1C1B19; transform-origin: 50% 100%; transform: rotate({{hand}}deg); transition: transform 0.5s ease\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: calc(50% - 6px); top: calc(50% - 6px); width: 12px; height: 12px; border-radius: 50%; background: #1C1B19\"><\u002Fdiv>\n<sc-for list=\"{{months}}\" as=\"m\" hint-placeholder-count=\"12\">\n<button type=\"button\" sc-camel-on-click=\"{{m.pick}}\" aria-pressed=\"{{m.on}}\" aria-label=\"{{m.aria}}\" style=\"position: absolute; left: {{m.left}}; top: {{m.top}}; transform: translate(-50%, -50%); width: 78px; min-height: 56px; padding: 2px 0; background: none; border: 0; color: {{m.fg}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.15\">\n<span style=\"font-size: 13px; color: #5E5A52\">{{m.n}}<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: {{m.weight}}\">{{m.name}}<\u002Fspan>\n<span lang=\"he\" dir=\"rtl\" style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 16px\">{{m.heb}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{noMonth.pick}}\" aria-pressed=\"{{noMonth.on}}\" style=\"align-self: center; min-height: 44px; padding: 0 18px; background: {{noMonth.bg}}; border: 1px solid #1C1B19; color: {{noMonth.fg}}; font-size: 17px; cursor: pointer\">{{noMonth.label}}<\u002Fbutton>\n<p style=\"margin: 0; font-size: 15px; color: #5E5A52; text-align: center\">Rings, outside in: feasts, fasts, events, oracles. A ? marks a day Scripture does not give or that is uncertain; where context points to a day, it is shown with a ? and the reasoning. Items dated by month alone are listed but not marked on the dial.<\u002Fp>\n<\u002Fdiv>\n\n<section aria-live=\"polite\" style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding-top: 8px\">\n<div style=\"font-size: 18px; font-style: italic; color: #5E5A52\">{{sm.numLine}}<\u002Fdiv>\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap\">\n<h2 style=\"margin: 0; font-size: 52px; font-weight: 500; line-height: 1\">{{sm.name}}<\u002Fh2>\n<span lang=\"he\" dir=\"rtl\" style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 44px; color: #A8261B\">{{sm.heb}}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 17px; color: #5E5A52\">{{sm.meta}}<\u002Fp>\n<sc-if value=\"{{sm.hasSeason}}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin: 0; font-size: 18px\">{{sm.season}}<\u002Fp><\u002Fsc-if>\n\n<sc-if value=\"{{sm.empty}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 16px 0; border-top: 1.5px solid #1C1B19; font-size: 18px; font-style: italic; color: #5E5A52\">Nothing to show. Turn on a category above.<\u002Fp>\n<\u002Fsc-if>\n\n<sc-for list=\"{{sm.groups}}\" as=\"g\" hint-placeholder-count=\"3\">\n<div style=\"display: flex; flex-direction: column; margin-top: 10px\">\n<h3 style=\"margin: 0; padding-bottom: 6px; border-bottom: 1.5px solid #1C1B19; font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 10px\">\n<span aria-hidden=\"true\" style=\"width: {{g.size}}; height: {{g.size}}; border-radius: 50%; border: 1.5px solid {{g.ink}}; background: {{g.fill}}; box-sizing: border-box\"><\u002Fspan>{{g.label}}\n<\u002Fh3>\n<sc-for list=\"{{g.items}}\" as=\"f\" hint-placeholder-count=\"3\">\n<div style=\"display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid #CFC8B8\">\n<span style=\"font-size: 20px; color: #A8261B; line-height: 1.2\">{{f.dl}}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 3px\">\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-size: 20px; font-weight: 500; line-height: 1.2\">{{f.t}}<\u002Fspan>\n<sc-if value=\"{{f.hasHeb}}\" hint-placeholder-val=\"{{ false }}\"><span lang=\"he\" dir=\"rtl\" style=\"font-family: 'Frank Ruhl Libre', serif; font-size: 19px\">{{f.h}}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{f.hasSub}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 16px; font-style: italic; color: #5E5A52\">{{f.sub}}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{f.hasX}}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size: 17px\">{{f.x}}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{f.hasW}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 16px; font-style: italic; color: #5E5A52\">Dating: {{f.w}}<\u002Fspan><\u002Fsc-if>\n<span style=\"font-size: 16px; color: #5E5A52\">{{f.r}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fdiv>\n\n<footer style=\"border-top: 1px solid #CFC8B8; padding-top: 20px; display: flex; flex-wrap: wrap; gap: 16px 48px; font-size: 16px; color: #5E5A52\">\n<p style=\"margin: 0; flex: 1 1 320px; min-width: 0\">Not tied to one month: the Sabbath (Exod 20:8-11; Lev 23:3), the New Moon (Num 10:10; 28:11-15; 1 Sam 20:5, 18-34; Isa 66:23; Ezek 46:1-3), the sabbatical year (Lev 25:1-7; Deut 15:1-11) and the Jubilee (Lev 25:8-55). Solomon’s twelve deputies each supplied the court for one month (1 Kgs 4:7, 27).<\u002Fp>\n<p style=\"margin: 0; flex: 1 1 320px; min-width: 0\">Months begin at the new moon and days at evening (Lev 23:32). The Flood’s months are placed by number; some read them from the autumn. Passages that give a day but not the month are kept under “Day given, month not named,” below the clock. First Fruits and Weeks follow later Jewish dating (Lev 23:11, 15-16). In leap years a second Adar is added. Hanukkah (John 10:22) is post-biblical and not shown.<\u002Fp>\n<p style=\"margin: 0; flex: 1 1 100%; font-size: 14px\">References follow the NASB95 (New American Standard Bible®, Copyright © 1960, 1971, 1977, 1995 by The Lockman Foundation).<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:3600}}\">\nclass Component extends DCLogic {\n  data() {\n    if (this._d) return this._d;\n    const R = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };\n    const months = [\n      { n: 1, name: \"Nisan\", heb: \"ניסן\", meta: \"March–April · 30 days · called Abib before the exile (Exod 13:4)\", season: \"Barley harvest; the latter rains end.\" },\n      { n: 2, name: \"Iyyar\", heb: \"אייר\", meta: \"April–May · 29 days · called Ziv (1 Kgs 6:1)\", season: \"The barley harvest ends; the dry season begins.\" },\n      { n: 3, name: \"Sivan\", heb: \"סיון\", meta: \"May–June · 30 days · named in Esth 8:9\", season: \"Wheat harvest.\" },\n      { n: 4, name: \"Tammuz\", heb: \"תמוז\", meta: \"June–July · 29 days · “the fourth month” (Jer 39:2)\", season: \"Summer heat; the first ripe grapes (Num 13:20).\" },\n      { n: 5, name: \"Av\", heb: \"אב\", meta: \"July–August · 30 days · “the fifth month” (2 Kgs 25:8)\", season: \"Grapes, figs and olives ripen.\" },\n      { n: 6, name: \"Elul\", heb: \"אלול\", meta: \"August–September · 29 days · named in Neh 6:15\", season: \"Vintage and summer fruit.\" },\n      { n: 7, name: \"Tishri\", heb: \"תשרי\", meta: \"September–October · 30 days · called Ethanim (1 Kgs 8:2) · begins the civil year\", season: \"The early rain begins; plowing.\" },\n      { n: 8, name: \"Cheshvan\", heb: \"חשון\", meta: \"October–November · 29 or 30 days · called Bul (1 Kgs 6:38)\", season: \"Rains; wheat and barley are sown.\" },\n      { n: 9, name: \"Kislev\", heb: \"כסלו\", meta: \"November–December · 29 or 30 days · named in Neh 1:1; Zech 7:1\", season: \"Winter rains.\" },\n      { n: 10, name: \"Tevet\", heb: \"טבת\", meta: \"December–January · 29 days · named in Esth 2:16\", season: \"The coldest month.\" },\n      { n: 11, name: \"Shevat\", heb: \"שבט\", meta: \"January–February · 30 days · named in Zech 1:7\", season: \"Rains continue; the almond trees blossom.\" },\n      { n: 12, name: \"Adar\", heb: \"אדר\", meta: \"February–March · 29 days · named in Ezra 6:15 and Esther\", season: \"The latter rains.\" }\n    ];\n    const items = [\n      // ---------- FEASTS AND HOLY DAYS ----------\n      { c: \"feast\", m: 1, p: [14], t: \"Passover\", h: \"פסח\", tr: \"Pesach\", x: \"The lamb is slain at twilight and eaten that night with unleavened bread and bitter herbs.\", r: \"Exod 12:1-14, 21-28, 43-49; Lev 23:4-5; Num 9:1-14; 28:16; Deut 16:1-7; cf. Ezek 45:21 · NT: 1 Cor 5:7\" },\n      { c: \"feast\", m: 1, p: R(15, 21), t: \"Unleavened Bread\", h: \"חג המצות\", tr: \"Chag HaMatzot\", x: \"Seven days without leaven, with holy convocations on the first and seventh days.\", r: \"Exod 12:15-20; 13:3-10; 23:15; 34:18; Lev 23:6-8; Num 28:17-25; Deut 16:3-8, 16; 2 Chr 8:13; cf. Ezek 45:21-24 · NT: 1 Cor 5:8\" },\n      { c: \"feast\", m: 1, p: [16], dl: \"16?\", t: \"First Fruits (the sheaf)\", h: \"העמר\", tr: \"HaOmer\", x: \"A sheaf of the first barley is waved before the LORD on the day after the sabbath; no new grain is eaten until then.\", r: \"Lev 23:9-14 · NT: 1 Cor 15:20-23\" },\n      { c: \"feast\", m: 1, p: [1], t: \"Cleansing of the sanctuary\", y: \"Ezekiel’s temple vision\", x: \"A bull without blemish is offered to cleanse the sanctuary.\", r: \"Ezek 45:18-19\" },\n      { c: \"feast\", m: 1, p: [7], t: \"Atonement for the one who errs\", y: \"Ezekiel’s temple vision\", x: \"The same offering on the seventh day for anyone who goes astray or is naive.\", r: \"Ezek 45:20\" },\n      { c: \"feast\", m: 1, p: [14], t: \"Passover kept at Sinai\", y: \"Second year after the Exodus\", x: \"Israel keeps the Passover in the wilderness of Sinai.\", r: \"Num 9:1-5\" },\n      { c: \"feast\", m: 1, p: [14], t: \"Passover at Gilgal; the manna ceases\", y: \"After crossing the Jordan\", x: \"Israel keeps the Passover in the plains of Jericho, eats the produce of the land the next day, and the manna stops.\", r: \"Josh 5:10-12\" },\n      { c: \"feast\", m: 1, p: [14], t: \"Josiah’s Passover\", y: \"Josiah’s eighteenth year\", x: \"A Passover unlike any since the days of Samuel, followed by seven days of Unleavened Bread.\", r: \"2 Kgs 23:21-23; 2 Chr 35:1-19\" },\n      { c: \"feast\", m: 1, p: [14], t: \"Passover of the returned exiles\", y: \"After the temple is finished, Darius’s sixth year\", x: \"The exiles keep the Passover and seven days of Unleavened Bread with joy.\", r: \"Ezra 6:19-22\" },\n      { c: \"feast\", m: 2, p: [14], t: \"Second Passover\", h: \"פסח שני\", tr: \"Pesach Sheni\", x: \"For anyone unclean from a dead body or away on a journey at the first Passover.\", r: \"Num 9:6-14\" },\n      { c: \"feast\", m: 2, p: [14], t: \"Hezekiah’s Passover\", y: \"Hezekiah’s first year\", x: \"Kept in the second month because the priests were not ready; Unleavened Bread is extended another seven days.\", r: \"2 Chr 30:1-27\" },\n      { c: \"feast\", m: 3, p: [6], dl: \"6?\", t: \"Weeks (Pentecost)\", h: \"שבעות\", tr: \"Shavuot\", x: \"Fifty days counted from the sheaf; two loaves of new wheat are waved as first fruits. Also called the Feast of the Harvest.\", r: \"Exod 23:16; 34:22; Lev 23:15-21; Num 28:26-31; Deut 16:9-12, 16; 2 Chr 8:13 · NT: Acts 2:1\" },\n      { c: \"feast\", m: 7, p: [1], t: \"Trumpets\", h: \"יום תרועה\", tr: \"Yom Teruah\", x: \"A rest and a holy convocation, a reminder by the blowing of trumpets.\", r: \"Lev 23:23-25; Num 29:1-6; cf. Ps 81:3\" },\n      { c: \"feast\", m: 7, p: [10], t: \"Day of Atonement\", h: \"יום הכפרים\", tr: \"Yom HaKippurim\", x: \"The high priest enters the holy of holies; the scapegoat bears Israel’s sins away. All humble their souls.\", r: \"Exod 30:10; Lev 16:1-34; 23:26-32; Num 29:7-11 · NT: Heb 9:7-12\" },\n      { c: \"feast\", m: 7, p: [10], t: \"Jubilee proclaimed\", y: \"Every fiftieth year\", x: \"The trumpet sounds through the land on the Day of Atonement to proclaim liberty.\", r: \"Lev 25:8-12\" },\n      { c: \"feast\", m: 7, p: R(15, 21), t: \"Booths (Tabernacles)\", h: \"חג הסכות\", tr: \"Chag HaSukkot\", x: \"Seven days living in booths, rejoicing at the ingathering of the harvest. In the year of release the Law is read aloud.\", r: \"Exod 23:16; 34:22; Lev 23:33-36, 39-43; Num 29:12-34; Deut 16:13-16; 31:10-13; Zech 14:16-19; cf. Ezek 45:25 · NT: John 7:2, 37\" },\    const sel = s.sel != null ? s.sel : 1;\n    const hand = s.hand != null ? s.hand : 30;\n    const show = Object.assign({ feast: true, fast: true, event: true, oracle: true }, s.show || {});\n    const CAT = {\n      feast: { label: \"Feasts and holy days\", ink: \"#A8261B\", fill: \"#A8261B\", size: \"8px\", r: 30.5 },\n      fast: { label: \"Fasts\", ink: \"#A8261B\", fill: \"#F5F2EA\", size: \"8px\", r: 27 },\n      event: { label: \"Dated events\", ink: \"#1C1B19\", fill: \"#1C1B19\", size: \"6px\", r: 23.5 },\n      oracle: { label: \"Prophetic oracles\", ink: \"#1C1B19\", fill: \"#F5F2EA\", size: \"7px\", r: 20 }\n    };\n    const keys = [\"feast\", \"fast\", \"event\", \"oracle\"];\n    const ords = [\"first\", \"second\", \"third\", \"fourth\", \"fifth\", \"sixth\", \"seventh\", \"eighth\", \"ninth\", \"tenth\", \"eleventh\", \"twelfth\"];\n    const rad = (deg) => (deg * Math.PI) / 180;\n    const at = (deg, r) => ({ left: (50 + r * Math.sin(rad(deg))).toFixed(2) + \"%\", top: (50 - r * Math.cos(rad(deg))).toFixed(2) + \"%\" });\n\n    const vis = D.items.filter((it) => show[it.c]);\n\n    const months = D.months.map((m) => {\n      const p = at(m.n * 30, 40.5);\n      const on = m.n === sel;\n      const count = vis.filter((it) => it.m === m.n).length;\n      return {\n        n: m.n, name: m.name, heb: m.heb, left: p.left, top: p.top, on: on,\n        fg: on ? \"#A8261B\" : \"#1C1B19\",\n        weight: on ? \"600\" : \"400\",\n        aria: m.name + \", month \" + m.n + \", \" + count + \" items\",\n        pick: () => {\n          const cur = (this.state && this.state.hand != null) ? this.state.hand : 30;\n          const norm = ((cur % 360) + 360) % 360;\n          const delta = ((((m.n * 30) - norm) % 360) + 540) % 360 - 180;\n          this.setState({ sel: m.n, hand: cur + delta });\n        }\n      };\n    });\n\n    const ticks = [];\n    for (let i = 0; i < 12; i++) ticks.push({ deg: i * 30 + 15 });\n\n    const dots = [];\n    vis.forEach((it) => {\n      if (!it.m) return;\n      const c = CAT[it.c];\n      it.p.forEach((d) => {\n        const q = at(it.m * 30 - 15 + (d - 0.5), c.r);\n        dots.push({ left: q.left, top: q.top, size: c.size, fill: c.fill, ink: c.ink });\n      });\n    });\n\n    const toggles = keys.map((k) => {\n      const c = CAT[k];\n      const on = show[k];\n      return {\n        label: c.label, on: on, ink: c.ink, fill: c.fill, size: c.size,\n        check: on ? \"#1C1B19\" : \"transparent\",\n        count: \"(\" + D.items.filter((it) => it.c === k).length + \")\",\n        pick: () => { const nx = Object.assign({}, show); nx[k] = !on; this.setState({ show: nx }); }\n      };\n    });\n    const allOn = keys.every((k) => show[k]);\n\n    const dayLabel = (it) => it.dl || (it.y === \"David’s monthly army roster\" ? \"All month\" : it.p.length === 0 ? \"?\" : it.p.length === 1 ? String(it.p[0]) : it.p[0] + \"–\" + it.p[it.p.length - 1]);\n    const base = sel === 0 ? { n: 0, name: \"Month not named\", heb: \"\", meta: \"These passages give the day of the month but not which month.\", season: \"\" } : D.months.find((m) => m.n === sel);\n    const groups = keys.filter((k) => show[k]).map((k) => {\n      const c = CAT[k];\n      const list = D.items.filter((it) => it.c === k && it.m === sel)\n        .map((it, i) => ({ it: it, i: i, key: it.p.length ? it.p[0] : (parseInt(String(it.dl || \"\").replace(/\\D*/, \"\"), 10) || 99) }))\n        .sort((a, b) => a.key - b.key || a.i - b.i)\n        .map((o) => {\n          const it = o.it;\n          const sub = [it.tr, it.y].filter(Boolean).join(\" · \");\n          return { dl: dayLabel(it), t: it.t, h: it.h || \"\", hasHeb: !!it.h, sub: sub, hasSub: !!sub, x: it.x, hasX: !!it.x, w: it.w || \"\", hasW: !!it.w, r: it.r };\n        });\n      return { label: c.label, ink: c.ink, fill: c.fill, size: c.size, items: list, n: list.length };\n    }).filter((g) => g.n > 0);\n\n    const sm = {\n      numLine: sel === 0 ? \"Day given, month not named\" : \"The \" + ords[sel - 1] + \" month\",\n      name: base.name, heb: base.heb, meta: base.meta, season: base.season, hasSeason: !!base.season,\n      groups: groups, empty: groups.length === 0\n    };\n\n    return {\n      months: months, ticks: ticks, dots: dots, hand: hand, wedgeFrom: sel * 30 - 15, wedgeColor: sel === 0 ? \"transparent\" : \"#E6DFCF\", sm: sm,\n      noMonth: { label: \"Day given, month not named (\" + vis.filter((it) => it.m === 0).length + \")\", on: sel === 0, fg: sel === 0 ? \"#F5F2EA\" : \"#1C1B19\", bg: sel === 0 ? \"#1C1B19\" : \"transparent\", pick: () => this.setState({ sel: 0 }) },\n      toggles: toggles,\n      allLabel: allOn ? \"Hide all\" : \"Show all\",\n      allPick: () => this.setState({ show: { feast: !allOn, fast: !allOn, event: !allOn, oracle: !allOn } })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<script>\n  var refTagger = { settings: { bibleVersion: \"NASB\", addLogosLink: false,\n    socialSharing: [], linksOpenNewWindow: true, convertHyperlinks: false,\n    noSearchClassNames: [\"no-ref\", \"ref-auto\"] } };\n<\u002Fscript>\n<script src=\"/notes/hebrew-calendar/verses.js\"><\u002Fscript>\n<\u002Fbody><\u002Fhtml>"</script>
